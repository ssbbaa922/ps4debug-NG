name: Build PS4Debug

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build debugger
        run: |
          cd debugger
          make
      - name: Build kdebugger
        run: |
          cd kdebugger
          make
      - name: Build installer payload
        run: |
          cd installer
          make
